[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whose-agent"
version = "0.6.0"
description = "A minimal negative-space benchmark for principal-bounded delegation."
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
  "jinja2>=3.1",
  "langfuse>=3",
  "langgraph>=1.2.2",
  "pydantic>=2.7",
  "pydantic-ai>=1.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

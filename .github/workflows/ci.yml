name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        run: uv run pytest

      - name: Run frontend checks
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run deterministic mock CLI
        run: uv run python -m whose_agent.cli run --scenarios scenarios --outputs outputs --mock

      - name: Verify generated output counts
        shell: bash
        run: |
          run_dir_count="$(find outputs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          run_dir="$(find outputs -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [[ "$run_dir_count" != "1" ]]; then
            echo "Expected 1 output run directory, got $run_dir_count"
            exit 1
          fi

          classification_count="$(find "$run_dir" -maxdepth 1 -name '*.classification.json' | wc -l | tr -d ' ')"
          response_count="$(find "$run_dir" -maxdepth 1 -name '*.response.md' | wc -l | tr -d ' ')"
          trace_count="$(find "$run_dir" -maxdepth 1 -name '*.trace.json' | wc -l | tr -d ' ')"
          state_trace_count="$(find "$run_dir" -maxdepth 1 -name '*.state_trace.json' | wc -l | tr -d ' ')"

          if [[ "$classification_count" != "10" ]]; then
            echo "Expected 10 classification files, got $classification_count"
            exit 1
          fi

          if [[ "$response_count" != "8" ]]; then
            echo "Expected 8 response files, got $response_count"
            exit 1
          fi

          if [[ "$trace_count" != "8" ]]; then
            echo "Expected 8 trace files, got $trace_count"
            exit 1
          fi

          if [[ "$state_trace_count" != "8" ]]; then
            echo "Expected 8 state trace files, got $state_trace_count"
            exit 1
          fi

      - name: Run deterministic arbitrary prompt mock CLIs
        shell: bash
        run: |
          uv run python -m whose_agent.cli detect-contract \
            --prompt "Use TypeScript with explicit models and avoid any" \
            --outputs contract-outputs \
            --mock

          uv run python -m whose_agent.cli run-prompt-loop \
            --prompt "Use TypeScript with explicit models and avoid any" \
            --outputs prompt-loop-outputs \
            --mock

      - name: Verify generated arbitrary prompt output counts
        shell: bash
        run: |
          contract_run_dir_count="$(find contract-outputs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          prompt_loop_run_dir_count="$(find prompt-loop-outputs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          contract_prompt_contract_count="$(find contract-outputs -mindepth 2 -name '*.prompt_contract.json' | wc -l | tr -d ' ')"
          prompt_loop_prompt_contract_count="$(find prompt-loop-outputs -mindepth 2 -name '*.prompt_contract.json' | wc -l | tr -d ' ')"
          prompt_loop_trace_count="$(find prompt-loop-outputs -mindepth 2 -name '*.loop_trace.json' | wc -l | tr -d ' ')"
          benchmark_artifact_count="$(
            find contract-outputs prompt-loop-outputs -mindepth 2 \
              \( -name '*.classification.json' \
                -o -name '*.response.md' \
                -o -name '*.trace.json' \
                -o -name '*.state_trace.json' \
                -o -name '*.checker.json' \
                -o -name '*.checker_comparison.json' \) \
              | wc -l | tr -d ' '
          )"

          if [[ "$contract_run_dir_count" != "1" ]]; then
            echo "Expected 1 detect-contract run directory, got $contract_run_dir_count"
            exit 1
          fi

          if [[ "$prompt_loop_run_dir_count" != "1" ]]; then
            echo "Expected 1 run-prompt-loop run directory, got $prompt_loop_run_dir_count"
            exit 1
          fi

          if [[ "$contract_prompt_contract_count" != "1" ]]; then
            echo "Expected 1 detect-contract prompt contract file, got $contract_prompt_contract_count"
            exit 1
          fi

          if [[ "$prompt_loop_prompt_contract_count" != "1" ]]; then
            echo "Expected 1 run-prompt-loop prompt contract file, got $prompt_loop_prompt_contract_count"
            exit 1
          fi

          if [[ "$prompt_loop_trace_count" != "1" ]]; then
            echo "Expected 1 run-prompt-loop loop trace file, got $prompt_loop_trace_count"
            exit 1
          fi

          if [[ "$benchmark_artifact_count" != "0" ]]; then
            echo "Expected 0 arbitrary prompt benchmark artifacts, got $benchmark_artifact_count"
            exit 1
          fi

      - name: Verify generated outputs are untracked
        shell: bash
        run: |
          tracked_outputs="$(git ls-files outputs contract-outputs prompt-loop-outputs | grep -E '\.(classification|prompt_contract|loop_trace|trace|state_trace|checker|checker_comparison)\.json$|\.response\.md$' || true)"
          if [[ -n "$tracked_outputs" ]]; then
            echo "Generated outputs are tracked:"
            echo "$tracked_outputs"
            exit 1
          fi

      - name: Run container smoke test
        run: WHOSE_AGENT_PORT=18000 ./scripts/container-smoke-test.sh

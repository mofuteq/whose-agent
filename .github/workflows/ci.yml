name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Run deterministic mock CLI
        run: uv run python -m whose_agent.cli run --scenarios scenarios --outputs outputs --mock

      - name: Verify generated output counts
        shell: bash
        run: |
          run_dir_count="$(find outputs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          run_dir="$(find outputs -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          if [[ "$run_dir_count" != "1" ]]; then
            echo "Expected 1 output run directory, got $run_dir_count"
            exit 1
          fi

          classification_count="$(find "$run_dir" -maxdepth 1 -name '*.classification.json' | wc -l | tr -d ' ')"
          response_count="$(find "$run_dir" -maxdepth 1 -name '*.response.md' | wc -l | tr -d ' ')"
          trace_count="$(find "$run_dir" -maxdepth 1 -name '*.trace.json' | wc -l | tr -d ' ')"
          state_trace_count="$(find "$run_dir" -maxdepth 1 -name '*.state_trace.json' | wc -l | tr -d ' ')"

          if [[ "$classification_count" != "7" ]]; then
            echo "Expected 7 classification files, got $classification_count"
            exit 1
          fi

          if [[ "$response_count" != "5" ]]; then
            echo "Expected 5 response files, got $response_count"
            exit 1
          fi

          if [[ "$trace_count" != "5" ]]; then
            echo "Expected 5 trace files, got $trace_count"
            exit 1
          fi

          if [[ "$state_trace_count" != "5" ]]; then
            echo "Expected 5 state trace files, got $state_trace_count"
            exit 1
          fi

      - name: Run deterministic prompt mock CLI
        shell: bash
        run: |
          uv run python -m whose_agent.cli run-prompt \
            --prompt "Implement a CLI in Rust that counts lines in a file." \
            --outputs prompt-outputs \
            --mock

          uv run python -m whose_agent.cli run-prompt \
            --prompt "Explain the difference between Deployment and StatefulSet." \
            --outputs prompt-outputs \
            --mock

      - name: Verify generated prompt output counts
        shell: bash
        run: |
          run_dir_count="$(find prompt-outputs -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          classification_count="$(find prompt-outputs -mindepth 2 -name '*.classification.json' | wc -l | tr -d ' ')"
          response_count="$(find prompt-outputs -mindepth 2 -name '*.response.md' | wc -l | tr -d ' ')"
          trace_count="$(find prompt-outputs -mindepth 2 -name '*.trace.json' | wc -l | tr -d ' ')"
          flow_count="$(find prompt-outputs -mindepth 2 -name '*.flow.mmd' | wc -l | tr -d ' ')"

          if [[ "$run_dir_count" != "2" ]]; then
            echo "Expected 2 prompt run directories, got $run_dir_count"
            exit 1
          fi

          if [[ "$classification_count" != "2" ]]; then
            echo "Expected 2 prompt classification files, got $classification_count"
            exit 1
          fi

          if [[ "$response_count" != "0" ]]; then
            echo "Expected 0 prompt response files, got $response_count"
            exit 1
          fi

          if [[ "$trace_count" != "0" ]]; then
            echo "Expected 0 prompt trace files, got $trace_count"
            exit 1
          fi

          if [[ "$flow_count" != "2" ]]; then
            echo "Expected 2 prompt flow files, got $flow_count"
            exit 1
          fi

      - name: Verify generated outputs are untracked
        shell: bash
        run: |
          tracked_outputs="$(git ls-files outputs prompt-outputs | grep -E '\.(classification\.json|response\.md|trace\.json|flow\.mmd)$' || true)"
          if [[ -n "$tracked_outputs" ]]; then
            echo "Generated outputs are tracked:"
            echo "$tracked_outputs"
            exit 1
          fi
